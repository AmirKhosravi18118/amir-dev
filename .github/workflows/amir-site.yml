name: amir-site
on:
  push:
    branches: [main]
    paths: ["site/**", "api/**", ".github/workflows/amir-site.yml"]
  pull_request:
    paths: ["site/**", "api/**", ".github/workflows/amir-site.yml"]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5.0.0
        with:
          go-version: stable
      - name: Site checks (i18n, seo-integrity, links, colours)
        run: node site/tests/check-build.mjs
      - name: Unit tests (gallery actions)
        run: node --test site/tests/gallery-actions.test.cjs
      - name: Firewall guards + self-test (red injection)
        run: bash site/scripts/guards.sh --self-test
      - name: Meta-guard R1–R5
        run: bash scripts/check-ci-contract.sh
      - name: API vet + test
        working-directory: api
        run: |
          go vet ./...
          go test ./...
