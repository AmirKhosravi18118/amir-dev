name: CI

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "cv_print.html"
      - "tests-ci/**"
      - "tools/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ci.yml"
      - "*.md"
  pull_request:
    paths:
      - "index.html"
      - "cv_print.html"
      - "tests-ci/**"
      - "tools/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ci.yml"
      - "*.md"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Format check (md/json/yml/ts — index.html exempt, traps #7)
        run: npm run format:check
      - name: HTML lint
        run: npm run lint
      - name: Inline JS syntax check
        run: npm run check:js

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Dependency audit (all deps)
        run: npm run audit:all
      - name: Dependency audit (prod-only — must stay clean, site has zero runtime deps)
        run: npm run audit:prod

  e2e-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: lint
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report
          path: playwright-report-ci
          retention-days: 5
