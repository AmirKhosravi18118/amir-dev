<div id="consentBanner" class="consent" hidden role="dialog" aria-live="polite">
  <p data-i18n="cons.text">
    This site uses consent-based, privacy-friendly analytics — page statistics only, no ads, no
    cross-site tracking. You decide; change your mind anytime by clearing this site's data.
  </p>
  <div style="display: flex; gap: 10px">
    <button id="consent-accept" class="btn btn-p" type="button" data-i18n="cons.accept">
      Accept
    </button>
    <button id="consent-decline" class="btn btn-s" type="button" data-i18n="cons.decline">
      Decline
    </button>
  </div>
</div>
