<!DOCTYPE html><html><head><meta charset="utf-8"><style>*{margin:0;padding:0;box-sizing:border-box}body{width:800px;height:520px;font-family:'Segoe UI',sans-serif;background:linear-gradient(150deg,#0f1b2d,#16283f 55%,#1a3352);color:#e8f0ff;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px}
.logo{font-size:44px;font-weight:900;letter-spacing:-.02em}.logo span{color:#5ea1ff}
h2{font-size:21px;font-weight:700;color:#a9c6ee}
.chips{display:flex;gap:10px}.chip{padding:7px 16px;border-radius:999px;background:rgba(94,161,255,.14);border:1px solid rgba(94,161,255,.4);font-size:13px;font-weight:700}
.card{margin-top:14px;width:520px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:20px 24px;display:grid;gap:11px}
.row{display:flex;justify-content:space-between;align-items:center}.w{font-size:16px;font-weight:700}.a{color:#7fd49b;font-size:13px;font-weight:700}
.bar{height:6px;border-radius:4px;background:rgba(255,255,255,.1)}.bar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,#5ea1ff,#3ddc97)}</style></head><body>
<div class="logo">Nex<span>Deutsch</span></div><h2>German vocabulary learning platform</h2>
<div class="chips"><div class="chip">Vocabulary</div><div class="chip">Spaced practice</div><div class="chip">Progress</div></div>
<div class="card">
<div class="row"><span class="w">die Brücke</span><span class="a">mastered ✓</span></div><div class="bar"><i style="width:100%"></i></div>
<div class="row"><span class="w">der Anschluss</span><span class="a">review today</span></div><div class="bar"><i style="width:62%"></i></div>
<div class="row"><span class="w">die Gewissheit</span><span class="a">learning</span></div><div class="bar"><i style="width:34%"></i></div>
</div></body></html>
