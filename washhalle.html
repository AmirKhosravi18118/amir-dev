<!DOCTYPE html><html><head><meta charset="utf-8"><style>*{margin:0;padding:0;box-sizing:border-box}body{width:800px;height:520px;font-family:'Segoe UI',sans-serif;background:linear-gradient(150deg,#101a24,#16283a 55%,#1b3a4a);color:#e8f4ff;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px}
.logo{font-size:42px;font-weight:900}.logo span{color:#39c6f4}
h2{font-size:20px;font-weight:700;color:#a9d4ee}
.chips{display:flex;gap:10px}.chip{padding:7px 16px;border-radius:999px;background:rgba(57,198,244,.13);border:1px solid rgba(57,198,244,.4);font-size:13px;font-weight:700}
.card{margin-top:14px;width:560px;display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.kpi{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:18px;text-align:center}
.kpi b{display:block;font-size:26px;margin-bottom:3px}.kpi small{color:#8fb8cc;font-size:11.5px;font-weight:700}</style></head><body>
<div class="logo">Wash<span>halle</span></div><h2>Operations app for a real car-wash business</h2>
<div class="chips"><div class="chip">Daily ops</div><div class="chip">Tracking</div><div class="chip">Real customer</div></div>
<div class="card">
<div class="kpi"><b>128</b><small>WASHES TODAY</small></div>
<div class="kpi"><b>€412</b><small>REVENUE</small></div>
<div class="kpi"><b>3</b><small>ACTIVE BAYS</small></div>
</div></body></html>
